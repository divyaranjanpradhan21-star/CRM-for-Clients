<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Identity & Title -->
    <title>Cafe's Corner | Restaurant CRM Management System</title>
    <meta name="description" content="Cafe's Corner Coffee Shop CRM Management System. Dedicated portals for Super Admin, Restaurant Admin, and Floor Staff." />
    <link rel="canonical" href="https://dinepulsecrm.com/" />
    <meta name="theme-color" content="#4a2c1d" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dinepulsecrm.com/" />
    <meta property="og:title" content="Cafe's Corner | Coffee Shop CRM Management System" />
    <meta property="og:description" content="Dedicated portals for Super Admin, Restaurant Admin, and Floor Staff." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:site_name" content="Cafe's Corner" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://dinepulsecrm.com/" />
    <meta name="twitter:title" content="Cafe's Corner | Coffee Shop CRM Management System" />
    <meta name="twitter:description" content="Dedicated portals for Super Admin, Restaurant Admin, and Floor Staff." />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Structured Data: Restaurant Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "SoftwareApplication",
          "name": "Cafe's Corner CRM Management System",
          "url": "https://dinepulsecrm.com",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web, Cloud",
          "description": "Multi-tenant restaurant CRM SaaS platform with dedicated Super Admin, Restaurant Admin, and Staff portals."
        },
        {
          "@type": "Restaurant",
          "name": "Cafe's Corner",
          "image": "https://dinepulsecrm.com/logo.png",
          "url": "https://dinepulsecrm.com",
          "servesCuisine": "Coffee, Bakery, Cafe",
          "priceRange": "$$"
        }
      ]
    }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#f8fafc] text-[#0f172a] antialiased selection:bg-[#4a2c1d] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
